---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fake-gpu-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/rhpds/gpu-resource-mgmt-automation
    targetRevision: rhoai-36-dra
    path: workloads/fake-gpu-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  # Phase C (2026-11-26): the gpu-config-plugin owns RUNTIME topology — it
  # merge-writes the topology CM (managedBy marker per pool; chart/GitOps
  # pools untouched). Ignore CM data differences so selfHeal doesn't fight
  # the plugin; chart values remain the initial state. The plugin's merges
  # preserve unmanaged pools, so ArgoCD re-syncs of chart pool changes still
  # apply (the plugin's next deploy merges on top of them).
  ignoreDifferences:
  - group: ""
    kind: ConfigMap
    name: topology
    namespace: gpu-operator
    jsonPointers:
    - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m