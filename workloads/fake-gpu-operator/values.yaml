---
environment:
  openshift: true

topologyConfigMap:
  enabled: true

topology:
  # Profile-driven node pools (new schema). Nodes join a pool via the
  # run.ai/simulated-gpu-node-pool label (key configurable via nodePoolLabelKey).
  # Profiles are the built-in gpu-profile-<name> ConfigMaps shipped by the chart.
  #
  # DYNAMIC TOPOLOGY (Phase C, 2026-11-26): this file is INITIAL STATE ONLY —
  # the gpu-config-plugin owns RUNTIME topology (merge semantics: it stamps
  # its pools managedBy and never touches unmarked entries; this app ignores
  # CM data differences). The static-era h200 pools (dra-share/dra-mig) are
  # REMOVED — they were empty husks after the nodes moved to the plugin-built
  # h100 pool, and the UI showed both products "Active". Build pools from the
  # console's GPU Configuration page; the Kueue mapping matrix
  # (hack/generate-kueue-agnostic.py, h200+h100) pre-covers both products.
  nodePools:
    # Helm map-merge keeps the chart-default `default` (L40S) pool unless a
    # null override deletes the key — retired with the device-plugin path.
    default: null
  nodePoolLabelKey: run.ai/simulated-gpu-node-pool
  migStrategy: none

kwokGpuDevicePlugin:
  enabled: false

# H200-MIRROR (Phase C): the device-plugin (extended-resource) path is
# retired — the booking flow under test is DRA-only and the topology has no
# `default` (L40S) pool. The nvidia.com/gpu quota left the ClusterQueues
# with it. Re-enable for the legacy device-plugin path.
devicePlugin:
  enabled: false
  image:
    repository: quay.io/eformat/fake-gpu-operator-device-plugin
    # :rhoai-36-dra isolates this workstream from :latest consumers
    # (prelude2 and other environments pull :latest — do not reuse that tag).
    tag: rhoai-36-dra

migFaker:
  enabled: false # we only need this when using run.ai scheduler
  image:
    repository: quay.io/eformat/fake-gpu-operator-mig-faker
    tag: rhoai-36-dra

statusUpdater:
  image:
    repository: quay.io/eformat/fake-gpu-operator-status-updater
    # Digest-pinned: the Merge fix (per-device overrides patch `devices` by
    # index instead of replacing the list) that makes the mixed-node topology
    # render — bump the digest when re-building from the fork.
    tag: sha256:e5f0bdf5ada7ef1cec521d9fc5dc25e478d96627000b10c8ada566ec4c2605af

# nvml-mock build for the DRA pools. This is OUR fork build now (built from
# eformat/k8s-test-infra, branch rhoai-36-dra): the Mokka generation plus the
# caps-on-carve patch — the bridge stages the MIG capability surface (procfs
# access files, mig-minors, /dev/nvidia-caps nodes, proc/devices entry)
# synchronously inside nvmlDeviceCreate/Destroy{Gpu,Compute}Instance, which is
# what lets the DRA driver's DynamicMIG flow reach CDI. Digest-pinned (the
# status-updater joins sha256:* tags with @); bump the digest when re-building
# from the fork. History: the chart default (sha-1706195) predates the MIG
# engine entirely (probe-proven MIG-less); the pre-fork Mokka build was
# sha256:1730a101…. launchContract: mokka is REQUIRED with this generation.
# sha256:275479aa… was the first fork build with the MIG engine.
# sha256:1430f8ed… serves MIG profile GEOMETRY from the capability surface
# regardless of current mode — whole-GPU claims flip boards' mode off
# (persisted in overrides.yaml), and the mode-gated geometry made every driver
# restart after one enumerate 0 MIG devices (the booking-drain cascade root
# cause, 2026-11-25).
# sha256:ff6b632f… completes it: the bridge's profile-ID substitution
# (DeviceGpuInstanceReportedProfileID / ProfileEnum via migStateOf) ALSO gated
# on the current mode — fixed to capability semantics. Verified by probe:
# mode-off boards serve the full H200 profile table.
# sha256:8381d3c2… agent stages/relabels the WHOLE staging root
# container_file_t (Stage + Apply): the staged tree inherits the agent
# volume's container_var_lib_t, which restricted CDI pods cannot open —
# every in-container nvidia-smi/libnvml/lsmod access answered EACCES.
# Root-recursion covers the CDI-mounted sys/{devices,bus,module} tree and
# usr/local/bin/lsmod (CDI audit 2026-11-25). UNCOMMITTED agent change —
# commit k8s-test-infra first.
nvmlMock:
  image:
    repository: quay.io/eformat/nvml-mock
    tag: sha256:8381d3c2d6de6c8cd123f9326f984e90c714a54f2bc69acc564a3c5731a052db
  launchContract: mokka

statusExporter:
  enabled: true
  image:
    repository: quay.io/eformat/fake-gpu-operator-status-exporter
    tag: rhoai-36-dra

topologyServer:
  image:
    repository: quay.io/eformat/fake-gpu-operator-topology-server
    tag: rhoai-36-dra

# DRA workstream: real NVIDIA DRA driver (dra-driver-nvidia-gpu 0.5.1
# subchart) against the mock-NVML pools. gpuOperator stays off — the fork's
# own device-plugin serves the `default` (fake) pool.
nvidiaDraDriver:
  enabled: true

dra-driver-nvidia-gpu:
  # Driver image built from eformat/dra-driver-nvidia-gpu (fork main,
  # v0.6.0-dev, commit 535f645, stamped v0.6.0-dra-mock.0): main carries the
  # ALT_PROC_DRIVER_PATH/ALT_PROC_DEVICES_PATH support the mock-tree CDI flow
  # needs — the stock v0.5.1 release ignores those envs. Pinned by the
  # workstream tag like the other fork components (the subchart's fullimage
  # helper joins repository:tag and cannot carry a digest; the pushed digest,
  # for traceability, is
  # sha256:4fcb14ed6b2f0b3b49d908f309db2d1dc4ae1c3b2a5931674e9e4b99aef2cb2f).
  image:
    repository: quay.io/eformat/dra-driver-nvidia-gpu
    # Always: the workstream tag is re-built from the fork (same tag, new
    # digest) — IfNotPresent would keep nodes on a stale digest across
    # restarts.
    pullPolicy: Always
    tag: rhoai-36-dra
  # Consumable shares DISABLED for the H200 mirror (Phase C): the topology
  # is dedicated whole boards + MIG slices — no time-sliced shares lane.
  # Whole devices publish without shares capacity, so discovery derives the
  # dedicated lane (…-gpu). Re-enable with a positive integer (claims per
  # device) if a shares lane is wanted later.
  # Requires k8s >= 1.36 (OCP 5) — DRAConsumableCapacity is default-on there.
  # nvidiaDriverRoot / gpuResourcesEnabledOverride / computeDomains disable
  # come from the chart's own defaults (mock-NVML wiring).
  consumableShares: "disabled"
  featureGates:
    ConsumableShares: true
    # Claim-driven MIG carving (alpha): the kubelet plugin publishes
    # MigDynamic devices (parent GPU + GI profile + placement) and carves the
    # GI/CI at PrepareDevice time when a claim selects one; releasing the
    # claim folds the partition back. End-to-end this requires the fork PAIR:
    # the eformat/k8s-test-infra nvml-mock bridge stages the MIG capability
    # surface (proc access files + mig-minors + /dev/nvidia-caps nodes +
    # proc/devices) synchronously inside the carve, and the driver image is
    # built from eformat/dra-driver-nvidia-gpu main (v0.6.0-dev), which honors
    # the ALT_PROC_* envs below. The stock v0.5.1 driver ignores those envs
    # and reads host /proc — where the staged caps never exist — and the
    # stock mock never stages caps on carve: that combination fails at
    # NodePrepareResources ("failed to parse GI capabilities file"), which is
    # what drove the fork pair. (FEATURE_GATES env delivery works with the
    # fork-main binary: the CLI layer derives env names from flag names.)
    DynamicMIG: true
  kubeletPlugin:
    # Pin the kubelet plugin to the DRA (mock-backend) pools only. Without
    # this it schedules on every node carrying the NFD pci-10de label —
    # including the `default` (fake-backend) pool, where nvml-mock never
    # stages /var/lib/nvml-mock and the pod hangs in Init forever, keeping
    # the DaemonSet (and the ArgoCD app) permanently Progressing.
    containers:
      gpus:
        env:
          # The DRA driver reads MIG capability files from /proc/driver by
          # default (host procfs — module-backed, absent on mock nodes, and
          # runc refuses mounts targeting /proc). The driver's own mock-node
          # mechanism: ALT_PROC_DRIVER_PATH / ALT_PROC_DEVICES_PATH point it
          # at the capability tree the nvml-mock agent stages under its
          # driver root. LOAD-BEARING with the fork-main driver build (which
          # honors them — the stock v0.5.1 binary ignores them): they are
          # what lets claim-carved partitions reach CDI through the staged
          # tree, including the caps the mock bridge stages on carve.
          - name: ALT_PROC_DRIVER_PATH
            value: /driver-root/proc/driver
          - name: ALT_PROC_DEVICES_PATH
            value: /driver-root/proc/devices
    # This REPLACES the subchart's default affinity (pci-10de) — the pool
    # label is the more precise selector here. Operator Exists (NOT a pool
    # list): pool names are RUNTIME topology owned by the gpu-config-plugin
    # (Phase C) — a hardcoded list orphans the driver the moment a pool is
    # renamed/added (live finding 2026-11-26: nodes moved to h100, driver
    # scheduled nowhere, every ResourceSlice stayed stale-H200). The driver
    # belongs on every simulated-GPU node, whatever its pool is called.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: run.ai/simulated-gpu-node-pool
                  operator: Exists
