---
environment:
  openshift: true

topologyConfigMap:
  enabled: true

topology:
  # Profile-driven node pools (new schema). Nodes join a pool via the
  # run.ai/simulated-gpu-node-pool label (key configurable via nodePoolLabelKey).
  # Profiles are the built-in gpu-profile-<name> ConfigMaps shipped by the chart.
  nodePools:
    # Legacy device-plugin path — serves the live gpu-booking plugin unchanged.
    # 8x NVIDIA L40S 48GB (the l40s profile's default device count).
    # The nulls drop the chart-default pool's old-format fields (Tesla-K80
    # demo default); with `gpu.profile` set, the profile drives everything.
    default:
      gpuProduct: null
      gpuCount: null
      gpuMemory: null
      gpu:
        backend: fake
        profile: l40s
    # DRA consumable shares (4 claims/device) — real NVIDIA DRA driver on
    # mock NVML. Label nodes into this pool to activate.
    dra-share:
      gpu:
        backend: mock
        profile: a100
    # Phase B: dynamic MIG via claims. Kept separate from dra-share per pool
    # hygiene (claim-driven repartitioning owns these devices).
    # Label nodes into this pool to activate.
    dra-mig:
      gpu:
        backend: mock
        profile: a100
        # MIG capability gate: the a100 builtin profile ships without
        # mig.supported_profiles, so mock NVML reports a MIG-less A100 and the
        # DRA driver publishes shares-only slices. This override (verbatim
        # device_defaults.mig from the validated probe config,
        # ~/.opencode/plan/a100-mig-profiles-nvml-mock.yaml) arms the
        # claim-driven MIG engine: mode enabled + the 5 canonical A100
        # profiles with placements. Deep-merge semantics: scalars/lists
        # replace, nested maps merge — the profiles list lands wholesale.
        # dra-share intentionally stays MIG-less (shares-only pool).
        overrides:
          device_defaults:
            mig:
              mode_current: enabled
              max_gpu_instances: 7
              supported_profiles:
                - name: 1g.5gb
                  nvml_profile: 1_SLICE
                  slices: 1
                  profile_id: 0
                  instances: 7
                  memory_mb: 4864
                  multiprocessors: 14
                  copy_engines: 1
                  placements:
                    - {start: 0, size: 1}
                    - {start: 1, size: 1}
                    - {start: 2, size: 1}
                    - {start: 3, size: 1}
                    - {start: 4, size: 1}
                    - {start: 5, size: 1}
                    - {start: 6, size: 1}
                  compute_instances:
                    - {nvml_profile: 1_SLICE, slices: 1, instances: 1, multiprocessors: 14, shared_copy_engines: 1}
                - name: 2g.10gb
                  nvml_profile: 2_SLICE
                  slices: 2
                  profile_id: 1
                  instances: 3
                  memory_mb: 9728
                  multiprocessors: 28
                  copy_engines: 2
                  placements:
                    - {start: 0, size: 2}
                    - {start: 2, size: 2}
                    - {start: 4, size: 2}
                    - {start: 6, size: 2}
                  compute_instances:
                    - {nvml_profile: 2_SLICE, slices: 2, instances: 1, multiprocessors: 28, shared_copy_engines: 2}
                - name: 3g.20gb
                  nvml_profile: 3_SLICE
                  slices: 3
                  profile_id: 2
                  instances: 2
                  memory_mb: 19968
                  multiprocessors: 42
                  copy_engines: 3
                  placements:
                    - {start: 0, size: 4}
                    - {start: 4, size: 4}
                  compute_instances:
                    - {nvml_profile: 3_SLICE, slices: 3, instances: 1, multiprocessors: 42, shared_copy_engines: 3}
                - name: 4g.20gb
                  nvml_profile: 4_SLICE
                  slices: 4
                  profile_id: 3
                  instances: 1
                  memory_mb: 19968
                  multiprocessors: 56
                  copy_engines: 4
                  placements:
                    - {start: 0, size: 4}
                    - {start: 4, size: 4}
                  compute_instances:
                    - {nvml_profile: 4_SLICE, slices: 4, instances: 1, multiprocessors: 56, shared_copy_engines: 4}
                - name: 7g.40gb
                  nvml_profile: 7_SLICE
                  slices: 7
                  profile_id: 4
                  instances: 1
                  memory_mb: 40448
                  multiprocessors: 98
                  copy_engines: 7
                  placements:
                    - {start: 0, size: 8}
                  compute_instances:
                    - {nvml_profile: 7_SLICE, slices: 7, instances: 1, multiprocessors: 98, shared_copy_engines: 7}
  nodePoolLabelKey: run.ai/simulated-gpu-node-pool
  migStrategy: none

kwokGpuDevicePlugin:
  enabled: false

devicePlugin:
  image:
    repository: quay.io/eformat/fake-gpu-operator-device-plugin
    # :rhoai-36-dra isolates this workstream from :latest consumers
    # (prelude2 and other environments pull :latest — do not reuse that tag).
    tag: rhoai-36-dra

migFaker:
  enabled: false # we only need this when using run.ai scheduler
  image:
    repository: quay.io/eformat/fake-gpu-operator-mig-faker
    tag: rhoai-36-dra

statusUpdater:
  image:
    repository: quay.io/eformat/fake-gpu-operator-status-updater
    tag: rhoai-36-dra

# nvml-mock build for the DRA pools. The chart-default pin (sha-1706195)
# predates the MIG engine entirely — probe-proven (ctypes): that build lacks
# the MIG symbols, so dynamic MIG can never activate on it. Digest-pinned to
# the build validated against the A100 MIG template (":latest" at validation
# time, 2026-11-24) — digests are immutable so this is reproducible; bump the
# digest when re-validating a newer upstream build. NOTE for the fork's e2e
# harness: upstream v0.2.x changed libnvidia-ml.so loading — adapt
# test/e2e/mock before moving the chart default off sha-1706195.
nvmlMock:
  image:
    repository: ghcr.io/nvidia/nvml-mock
    tag: sha256:1730a101817c21a9745af75a7a1dce0b066370b24b80cd987b4fba3ae7df1042

statusExporter:
  enabled: true
  image:
    repository: quay.io/eformat/fake-gpu-operator-status-exporter
    tag: rhoai-36-dra

topologyServer:
  image:
    repository: quay.io/eformat/fake-gpu-operator-topology-server
    tag: rhoai-36-dra

# DRA workstream: real NVIDIA DRA driver (dra-driver-nvidia-gpu 0.5.1
# subchart) against the mock-NVML pools. gpuOperator stays off — the fork's
# own device-plugin serves the `default` (fake) pool.
nvidiaDraDriver:
  enabled: true

dra-driver-nvidia-gpu:
  # Consumable shares: 4 claims per device (integer mode) + alpha gate on.
  # Requires k8s >= 1.36 (OCP 5) — DRAConsumableCapacity is default-on there.
  # nvidiaDriverRoot / gpuResourcesEnabledOverride / computeDomains disable
  # come from the chart's own defaults (mock-NVML wiring).
  consumableShares: "4"
  featureGates:
    ConsumableShares: true
  kubeletPlugin:
    # Pin the kubelet plugin to the DRA (mock-backend) pools only. Without
    # this it schedules on every node carrying the NFD pci-10de label —
    # including the `default` (fake-backend) pool, where nvml-mock never
    # stages /var/lib/nvml-mock and the pod hangs in Init forever, keeping
    # the DaemonSet (and the ArgoCD app) permanently Progressing.
    # This REPLACES the subchart's default affinity (pci-10de) — the pool
    # label is the more precise selector here.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: run.ai/simulated-gpu-node-pool
                  operator: In
                  values:
                    - dra-share
                    - dra-mig
