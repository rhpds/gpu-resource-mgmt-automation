---
environment:
  openshift: true

topologyConfigMap:
  enabled: true

topology:
  # Single shared pool across all 3 nodes.
  # 99 tenants × 8 GPUs / 3 nodes = 264 GPUs per node.
  # MIG counts scaled ×33 from the per-tenant baseline.
  # gpuMemory in MiB: 192 GiB = 196608 MiB
  nodePools:
    gpu-pool:
      gpuProduct: NVIDIA-GB200-NVL
      gpuCount: 264
      gpuMemory: 196608
  nodePoolLabelKey: run.ai/simulated-gpu-node-pool
  migStrategy: none

kwokGpuDevicePlugin:
  enabled: false

devicePlugin:
  image:
    repository: quay.io/eformat/fake-gpu-operator-device-plugin
    tag: latest

migFaker:
  enabled: false # we only need this when using run.ai scheduler
  image:
    repository: quay.io/eformat/fake-gpu-operator-mig-faker
    tag: latest

statusUpdater:
  image:
    repository: quay.io/eformat/fake-gpu-operator-status-updater
    tag: latest

statusExporter:
  enabled: true
  image:
    repository: quay.io/eformat/fake-gpu-operator-status-exporter
    tag: latest

topologyServer:
  image:
    repository: quay.io/eformat/fake-gpu-operator-topology-server
    tag: latest

