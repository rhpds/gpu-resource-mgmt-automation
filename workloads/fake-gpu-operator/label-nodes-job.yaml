---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-node-labeler
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-labeler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-node-labeler
subjects:
  - kind: ServiceAccount
    name: gpu-node-labeler
    namespace: gpu-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mig-config
  namespace: gpu-operator
data:
  mig.config: |
    version: v1
    mig-configs:
      selected:
      - devices: ["0","1","2","3","4","5","6","7"]
        mig-enabled: true
        mig-devices:
          - name: 1g.23gb
            count: 7
          - name: 2g.47gb
            count: 2
          - name: 3g.93gb
            count: 2
          - name: 7g.189gb
            count: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-node-labeler
  namespace: gpu-operator
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: gpu-node-labeler
      restartPolicy: OnFailure
      volumes:
        - name: mig-config
          configMap:
            name: mig-config
      containers:
        - name: labeler
          image: registry.redhat.io/openshift4/ose-cli:latest
          volumeMounts:
            - name: mig-config
              mountPath: /config
          command:
            - /bin/bash
            - -c
            - |
              MIG_CONFIG=$(cat /config/mig.config)
              POOLS=(tenanta tenantb tenantc)
              IDX=0
              for node in $(oc get nodes -l node-role.kubernetes.io/worker --no-headers -o name); do
                POOL=${POOLS[$((IDX % 3))]}
                echo "Labeling $node -> pool: $POOL"
                oc label "$node" run.ai/simulated-gpu-node-pool="$POOL" --overwrite
                oc label "$node" node-role.kubernetes.io/runai-dynamic-mig=true --overwrite
                oc annotate "$node" "run.ai/mig.config=${MIG_CONFIG}" --overwrite
                IDX=$((IDX + 1))
              done
