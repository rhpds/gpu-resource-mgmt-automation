---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-node-labeler
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-labeler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-node-labeler
subjects:
  - kind: ServiceAccount
    name: gpu-node-labeler
    namespace: gpu-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mig-config
  namespace: gpu-operator
data:
  mig.config: |
    version: v1
    mig-configs:
      selected:
      - devices: all
        mig-enabled: true
        mig-devices:
          - name: 1g.23gb
            count: 7
          - name: 2g.47gb
            count: 2
          - name: 3g.93gb
            count: 2
          - name: 7g.189gb
            count: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-node-labeler
  namespace: gpu-operator
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: gpu-node-labeler
      restartPolicy: OnFailure
      volumes:
        - name: mig-config
          configMap:
            name: mig-config
      containers:
        - name: labeler
          image: registry.redhat.io/openshift4/ose-cli:latest
          volumeMounts:
            - name: mig-config
              mountPath: /config
          command:
            - /bin/bash
            - -c
            - |
              MIG_CONFIG=$(cat /config/mig.config)
              # GPU allocatable counts: 99 tenants × 8 GPUs / 3 nodes = 264 full GPUs per node
              # MIG slices: 264 GPUs × (7, 2, 2, 1) per GPU for GB200 NVL partitioning
              GPU_COUNT=264
              MIG_1G=1848
              MIG_2G=528
              MIG_3G=528
              MIG_7G=264

              for node in $(oc get nodes -l node-role.kubernetes.io/worker --no-headers -o name); do
                echo "Labeling $node -> pool: gpu-pool"
                oc label "$node" run.ai/simulated-gpu-node-pool=gpu-pool --overwrite
                oc label "$node" node-role.kubernetes.io/runai-dynamic-mig=true --overwrite
                oc annotate "$node" "run.ai/mig.config=${MIG_CONFIG}" --overwrite

                # Patch node allocatable with GPU + MIG resource counts statically
                nodename=$(echo "$node" | cut -d/ -f2)
                echo "Patching $nodename allocatable: gpu=$GPU_COUNT, mig-1g.23gb=$MIG_1G"
                oc patch node "$nodename" --subresource=status --type=merge -p "{
                  \"status\": {
                    \"allocatable\": {
                      \"nvidia.com/gpu\": \"${GPU_COUNT}\",
                      \"nvidia.com/mig-1g.23gb\": \"${MIG_1G}\",
                      \"nvidia.com/mig-2g.47gb\": \"${MIG_2G}\",
                      \"nvidia.com/mig-3g.93gb\": \"${MIG_3G}\",
                      \"nvidia.com/mig-7g.189gb\": \"${MIG_7G}\"
                    }
                  }
                }"
              done
---
# DaemonSet that continuously patches node allocatable GPU+MIG resources.
# Runs every 20s to stay ahead of the kubelet device-manager reset interval.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-resource-patcher
  namespace: gpu-operator
spec:
  selector:
    matchLabels:
      app: gpu-resource-patcher
  template:
    metadata:
      labels:
        app: gpu-resource-patcher
    spec:
      serviceAccountName: gpu-node-labeler
      tolerations:
        - operator: Exists
      containers:
        - name: patcher
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GPU_COUNT
              value: "264"
            - name: MIG_1G
              value: "1848"
            - name: MIG_2G
              value: "528"
            - name: MIG_3G
              value: "528"
            - name: MIG_7G
              value: "264"
          command:
            - /bin/bash
            - -c
            - |
              while true; do
                oc patch node "$NODE_NAME" --subresource=status --type=merge -p "{
                  \"status\":{\"allocatable\":{
                    \"nvidia.com/gpu\":\"${GPU_COUNT}\",
                    \"nvidia.com/mig-1g.23gb\":\"${MIG_1G}\",
                    \"nvidia.com/mig-2g.47gb\":\"${MIG_2G}\",
                    \"nvidia.com/mig-3g.93gb\":\"${MIG_3G}\",
                    \"nvidia.com/mig-7g.189gb\":\"${MIG_7G}\"
                  }}}" 2>/dev/null
                sleep 20
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
