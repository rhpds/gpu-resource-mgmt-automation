            decoders: 1
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 2
            multiprocessors: 14
            shared_copy_engines: 2
            decoders: 1
      - name: "3g.20gb"
        nvml_profile: "3_SLICE"
        slices: 3
        profile_id: 9
        instances: 2
        memory_mb: 19968
        multiprocessors: 42
        copy_engines: 3
        decoders: 2
        placements:
          - {start: 0, size: 4}
          - {start: 4, size: 4}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 3
            multiprocessors: 14
            shared_copy_engines: 3
            decoders: 2
          - nvml_profile: "2_SLICE"
            slices: 2
            instances: 1
            multiprocessors: 28
            shared_copy_engines: 3
            decoders: 2
          - nvml_profile: "3_SLICE"
            slices: 3
            instances: 1
            multiprocessors: 42
            shared_copy_engines: 3
            decoders: 2
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 3
            multiprocessors: 14
            shared_copy_engines: 3
            decoders: 2
      - name: "4g.20gb"
        nvml_profile: "4_SLICE"
        slices: 4
        profile_id: 5
        instances: 1
        memory_mb: 19968
        multiprocessors: 56
        copy_engines: 4
        decoders: 2
        placements:
          - {start: 0, size: 4}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 4
            multiprocessors: 14
            shared_copy_engines: 4
            decoders: 2
          - nvml_profile: "2_SLICE"
            slices: 2
            instances: 2
            multiprocessors: 28
            shared_copy_engines: 4
            decoders: 2
          - nvml_profile: "4_SLICE"
            slices: 4
            instances: 1
            multiprocessors: 56
            shared_copy_engines: 4
            decoders: 2
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 4
            multiprocessors: 14
            shared_copy_engines: 4
            decoders: 2
      - name: "7g.40gb"
        nvml_profile: "7_SLICE"
        slices: 7
        profile_id: 0
        instances: 1
        memory_mb: 40192
        multiprocessors: 98
        copy_engines: 7
        decoders: 5
        jpeg: 1
        ofa: 1
        placements:
          - {start: 0, size: 8}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 7
            multiprocessors: 14
            shared_copy_engines: 7
            decoders: 5
            jpeg: 1
            ofa: 1
          - nvml_profile: "2_SLICE"
            slices: 2
            instances: 3
            multiprocessors: 28
            shared_copy_engines: 7
            decoders: 5
            jpeg: 1
            ofa: 1
          - nvml_profile: "3_SLICE"
            slices: 3
            instances: 2
            multiprocessors: 42
            shared_copy_engines: 7
            decoders: 5
            jpeg: 1
            ofa: 1
          - nvml_profile: "4_SLICE"
            slices: 4
