{{- if or (.Values.gpuOperator).enabled (.Values.nvidiaDraDriver).enabled -}}
# Per-product MIG partition tables for nvml-mock >= v0.2 (Mokka), verbatim
# from upstream NVIDIA/k8s-test-infra
# pkg/gpu/mocknvml/configs/mock-nvml-config-<product>.mig.yaml. The mock
# controller renders a pool's table into the per-pool ConfigMap's
# mig-profiles.yaml key (the sibling of config.yaml the engine resolves it
# from) whenever the pool's profile turns device_defaults.mig.mode_current
# on. MIG pool hygiene: only a100/h100/b200/gb200 ship tables — l40s/t4 have
# no MIG silicon and their profiles never enable the mode.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mig-profiles-a100
  labels:
    # NOT the mock controller's managed label pair (managed-by +
    # component=nvml-mock) — the reconciler prunes anything carrying those
    # that isn't in its desired per-pool set, and these tables are
    # chart-managed like the gpu-profile CMs (which use their own label too).
    fake-gpu-operator/mig-profiles: "true"
data:
  config.mig.yaml: |
    version: 1

    # NVIDIA MIG user guide, Supported MIG Profiles, Table 12
    # (A100-SXM4-40GB). nvml_profile binds each row to the NVML enum the mock
    # keys on.
    #
    # Every row declares its full geometry. `slices` restates the width the
    # nvml_profile enum already spans so load can reconcile the two rather
    # than trust either. `placements` are in *memory units*, not compute
    # slices: a 7-slice board has eight units, so a 1g row is seven starts of
    # size 1 and the full-board row is one `{start: 0, size: 8}`.
    # `compute_instances` is the row's `mig -lcip` listing, and its engine
    # counts are NVML's Shared* fields, which repeat the GPU instance's.
    #
    # The REV suffixes name variants of one width rather than widths of their own:
    # REV1 is the +me media extension, REV2 the double-memory profile. Both, and
    # the rest of the schema, are described in docs/mig.md.
    supported_profiles:
      - name: "1g.5gb"
        nvml_profile: "1_SLICE"
        slices: 1
        profile_id: 19
        instances: 7
        # Not 5120. A slice holds an eighth of a 40 GiB board, and the "5gb"
        # in the name is that eighth rounded for display. The raw allocation
        # is what NVML reports and what -lgip prints as 4.75 GiB.
        memory_mb: 4864
        multiprocessors: 14
        copy_engines: 1
        placements:
          - {start: 0, size: 1}
          - {start: 1, size: 1}
          - {start: 2, size: 1}
          - {start: 3, size: 1}
          - {start: 4, size: 1}
          - {start: 5, size: 1}
          - {start: 6, size: 1}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
      - name: "1g.5gb+me"
        nvml_profile: "1_SLICE_REV1"
        slices: 1
        profile_id: 20
        instances: 1
        memory_mb: 4864
        multiprocessors: 14
        copy_engines: 1
        decoders: 1
        jpeg: 1
        ofa: 1
        placements:
          - {start: 0, size: 1}
          - {start: 1, size: 1}
          - {start: 2, size: 1}
          - {start: 3, size: 1}
          - {start: 4, size: 1}
          - {start: 5, size: 1}
          - {start: 6, size: 1}
        compute_instances:
          - nvml_profile: "1_SLICE"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
            decoders: 1
            jpeg: 1
            ofa: 1
          - nvml_profile: "1_SLICE_REV1"
            slices: 1
            instances: 1
            multiprocessors: 14
            shared_copy_engines: 1
            decoders: 1
            jpeg: 1
            ofa: 1
      - name: "1g.10gb"
        nvml_profile: "1_SLICE_REV2"
        slices: 1
        profile_id: 15
        instances: 4
        memory_mb: 9856
        multiprocessors: 14
        copy_engines: 1
        decoders: 1
        placements:
          - {start: 0, size: 2}
          - {start: 2, size: 2}
          - {start: 4, size: 2}
          - {start: 6, size: 2}
        compute_instances:
