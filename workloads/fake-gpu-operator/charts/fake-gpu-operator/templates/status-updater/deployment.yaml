{{- if (.Values.statusUpdater).enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-updater
  annotations:
    checksum/topology: {{ include (print $.Template.BasePath "/topology-cm.yml") . | sha256sum }}
  labels:
    app: status-updater
spec:
  selector:
    matchLabels:
      app: status-updater
      component: status-updater
  replicas: 1
  template:
    metadata:
      annotations:
        checksum/topology: {{ include (print $.Template.BasePath "/topology-cm.yml") . | sha256sum }}
      labels:
        app: status-updater
        component: status-updater
    spec:
      containers:
        - name: status-updater
          image: "{{ (.Values.statusUpdater).image.repository }}{{ if (.Values.statusUpdater).image.tag | hasPrefix "sha256:" }}@{{ else }}:{{ end }}{{ (.Values.statusUpdater).image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: "{{ (.Values.statusUpdater).image.pullPolicy }}"
          resources:
            {{- toYaml (.Values.statusUpdater).resources | nindent 12 }}
          env:
            - name: TOPOLOGY_CM_NAME
              value: topology
            - name: TOPOLOGY_CM_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: FAKE_GPU_OPERATOR_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: RESOURCE_RESERVATION_NAMESPACE
              value: "{{ (.Values.environment).resourceReservationNamespace }}"
            - name: PROMETHEUS_URL
              value: "{{ (.Values.prometheus).url }}"
            - name: DISABLE_NODE_LABELING
              value: "{{ (.Values.statusUpdater).disableNodeLabeling }}"
            - name: NVML_MOCK_IMAGE
              # Digest pins (tag == "sha256:...") must join with "@" — a colon
              # there is an invalid image reference.
              value: "{{ (.Values.nvmlMock).image.repository | default "ghcr.io/nvidia/nvml-mock" }}{{ if (.Values.nvmlMock).image.tag | hasPrefix "sha256:" }}@{{ else }}:{{ end }}{{ (.Values.nvmlMock).image.tag | default "latest" }}"
            - name: NVML_MOCK_LAUNCH_CONTRACT
              value: "{{ (.Values.nvmlMock).launchContract | default "legacy" }}"
            {{- if (.Values.statusUpdater).runaiIntegration.enabled }}
            - name: RUNAI_INTEGRATION_ENABLED
              value: "true"
            - name: RUNAI_INTEGRATION_POLLING_INTERVAL
              value: "{{ (.Values.statusUpdater).runaiIntegration.pollingInterval }}"
            {{- end }}
      restartPolicy: Always
      serviceAccountName: status-updater
      imagePullSecrets:
        - name: gcr-secret
{{- end -}}
