---
{{- range .Values.roleBindings }}
---
{{ include "rbac.role-binding" . }}
{{- end }}
{{- range $username := .Values.userNamespaces.users }}
{{- range $clusterRole := $.Values.userNamespaces.clusterRoles }}
{{- $userRoleBinding := dict }}
{{- $_ := set $userRoleBinding "name" (printf "%s-%s" $username $clusterRole) }}
{{- $_ := set $userRoleBinding "namespace" (printf "user-%s" $username) }}
{{- $_ := set $userRoleBinding "clusterRole" $clusterRole }}
{{- $_ := set $userRoleBinding "users" (list (printf "%s" $username)) }}
---
{{ include "rbac.role-binding" $userRoleBinding }}
{{- end }}
{{- $builderRoleBinding := dict }}
{{- $_ := set $builderRoleBinding "name" "builder-hostmount-scc" }}
{{- $_ := set $builderRoleBinding "namespace" (printf "user-%s" $username) }}
{{- $_ := set $builderRoleBinding "clusterRole" "system:openshift:scc:hostmount-anyuid-v2" }}
{{- $_ := set $builderRoleBinding "serviceAccounts" (list (dict "name" "builder" "namespace" (printf "user-%s" $username))) }}
---
{{ include "rbac.role-binding" $builderRoleBinding }}
{{- end }}
{{- range $username := .Values.userNamespaces.htpasswdUsers }}
{{- range $clusterRole := $.Values.userNamespaces.clusterRoles }}
{{- $userRoleBinding := dict }}
{{- $_ := set $userRoleBinding "name" (printf "%s-%s" $username $clusterRole) }}
{{- $_ := set $userRoleBinding "namespace" (printf "user-%s" $username) }}
{{- $_ := set $userRoleBinding "clusterRole" $clusterRole }}
{{- $_ := set $userRoleBinding "users" (list $username) }}
---
{{ include "rbac.role-binding" $userRoleBinding }}
{{- end }}
{{- $builderRoleBinding := dict }}
{{- $_ := set $builderRoleBinding "name" "builder-hostmount-scc" }}
{{- $_ := set $builderRoleBinding "namespace" (printf "user-%s" $username) }}
{{- $_ := set $builderRoleBinding "clusterRole" "system:openshift:scc:hostmount-anyuid-v2" }}
{{- $_ := set $builderRoleBinding "serviceAccounts" (list (dict "name" "builder" "namespace" (printf "user-%s" $username))) }}
---
{{ include "rbac.role-binding" $builderRoleBinding }}
{{- end }}
{{- range $i := until (int $.Values.tenantCount) }}
{{- $n := add1 $i }}
{{- $tName := printf "%s%d" $.Values.tenantPrefix $n }}
{{- $adminUser := printf "%s-admin" $tName }}
{{- range $uname := $.Values.tenantUsers }}
{{- $fullUser := printf "%s-%s" $tName $uname }}
{{- range $clusterRole := $.Values.tenantClusterRoles }}
{{- $rb := dict "name" (printf "%s-%s" $fullUser $clusterRole) "namespace" $fullUser "clusterRole" $clusterRole "users" (list $fullUser) }}
---
{{ include "rbac.role-binding" $rb }}
{{- end }}
{{- $builder := dict "name" "builder-hostmount-scc" "namespace" $fullUser "clusterRole" "system:openshift:scc:hostmount-anyuid-v2" "serviceAccounts" (list (dict "name" "builder" "namespace" $fullUser)) }}
---
{{ include "rbac.role-binding" $builder }}
{{- /* Give the tenant admin view access in each user namespace so they can see pods/workloads */}}
{{- $adminRb := dict "name" (printf "%s-view" $adminUser) "namespace" $fullUser "clusterRole" "view" "users" (list $adminUser) }}
---
{{ include "rbac.role-binding" $adminRb }}
{{- end }}
{{- end }}
