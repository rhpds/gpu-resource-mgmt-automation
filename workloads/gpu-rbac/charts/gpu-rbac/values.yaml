---
dynamicGpuConfig: true

reservations:
  h200: {}

gpuConfig:
  resources:
    - name: "H200 Full GPU"
      type: "nvidia.com/gpu"
      count: 8
      share: 0.0625
      gpuEquivalent: 1.0
    - name: "MIG 3g.93gb"
      type: "nvidia.com/mig-3g.93gb"
      count: 16
      share: 0.03125
      gpuEquivalent: 0.5
    - name: "MIG 2g.47gb"
      type: "nvidia.com/mig-2g.47gb"
      count: 16
      share: 0.015625
      gpuEquivalent: 0.25
    - name: "MIG 1g.23gb"
      type: "nvidia.com/mig-1g.23gb"
      count: 56
      share: 0.0078125
      gpuEquivalent: 0.125
  totalCpu: 316
  totalMemory: 3460

totalResources:
  h200:
    cpu: 316
    memory: 3460
    nvidia.com/gpu:
      count: 8
      share: 0.0625
    nvidia.com/mig-3g.93gb:
      count: 16
      share: 0.03125
    nvidia.com/mig-2g.47gb:
      count: 16
      share: 0.015625
    nvidia.com/mig-1g.23gb:
      count: 56
      share: 0.0078125


clusterRoles:
  - name: workshop-tenant-admin
    rules:
      - apiGroups: [""]
        resources: ["nodes", "namespaces", "pods", "pods/log", "services", "configmaps", "events"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["project.openshift.io"]
        resources: ["projects"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["kueue.x-k8s.io"]
        resources:
          - cohorts
          - clusterqueues
          - clusterqueues/status
          - localqueues
          - localqueues/status
          - workloads
          - workloads/status
          - resourceflavors
          - topologies
        verbs: ["get", "list", "watch"]
      - apiGroups: ["infrastructure.opendatahub.io"]
        resources: ["hardwareprofiles", "hardwareprofiles/status"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["nvidia.com"]
        resources: ["clusterpolicies"]
        verbs: ["get", "list", "watch"]
  - name: kueue-cluster-visibility
    rules:
      - apiGroups:
          - kueue.x-k8s.io
        resources:
          - cohorts
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - kueue.x-k8s.io
        resources:
          - clusterqueues
          - localqueues
          - topologies
          - workloads
          - resourceflavors
          - workloadpriorityclasses
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - kueue.x-k8s.io
        resources:
          - clusterqueues/status
          - localqueues/status
          - topologies/status
          - workloads/status
          - resourceflavors/status
          - workloadpriorityclasses/status
        verbs:
          - get

clusterRoleBindings:
  - name: kueue-cluster-visibility
    clusterRole: kueue-cluster-visibility
    groups:
      - users
  - name: gpu-booking-plugin-admin
    clusterRole: gpu-booking-plugin-admin
    users:
      - tenanta-admin
      - tenantb-admin
      - tenantc-admin
  - name: workshop-tenant-admin
    clusterRole: workshop-tenant-admin
    users:
      - tenanta-admin
      - tenantb-admin
      - tenantc-admin

namespaces:
  - name: maas
    labels:
      opendatahub.io/dashboard: "true"
      kueue-managed: "true"
      kueue.openshift.io/managed: "true"
      rhai-tmm.dev/owner: "admin"
    annotations:
      openshift.io/display-name: MaaS Models Deployment
      openshift.io/description: >
        A managed namespace for MaaS Model Deployment
      openshift.io/requester: gitops
    includeUnreserved: true

roleBindings:

localQueues:

clusterQueues:
  default:
    resourceGroups:
      - flavors:
          default-flavor:
            cpu: 32
            memory: 128Gi

cohorts: {}

topologies:
  default:
    levels:
      - nodeLabel: topology.kubernetes.io/zone
      - nodeLabel: kubernetes.io/hostname

resourceFlavors:
  default-flavor: {}
  gb200-tenanta:
    nodeLabels:
      run.ai/simulated-gpu-node-pool: tenanta
    topologyName: default
  gb200-tenantb:
    nodeLabels:
      run.ai/simulated-gpu-node-pool: tenantb
    topologyName: default
  gb200-tenantc:
    nodeLabels:
      run.ai/simulated-gpu-node-pool: tenantc
    topologyName: default

workloadPriorityClasses:
  high-priority:
    value: 10000
    description: High priority usage, associated with the h200-priority ClusterQueue

hardwareProfiles:
  default-profile:
    displayName: Default (CPU only)
    description: >-
      This profile offers access to the CPU-only worker nodes in this cluster
      and is suitable for use with CPU-based workbenches, pipelines, etc.
    cpu: 4
    mem: 18Gi
  unreserved-gpu:
    displayName: GB300 GPU (Unreserved)
    description: >-
      This profile offers access to an entire GB300 from GPU workers, drawing
      from the unreserved pool of resources (limited availability and first
      come, first served)
    cpu: 28
    mem: 110Gi
    gpu:
      identifier: nvidia.com/gpu
      displayName: GB300 GPU
      max: 32
    localQueue: unreserved
  unreserved-mig-93gb:
    displayName: 93GB Slice (Unreserved)
    description: >-
      This profile offers access to a 93GB MIG slice from GPU workers, drawing
      from the unreserved pool of resources (limited availability and first
      come, first served)
    cpu: 14
    mem: 93Gi
    gpu:
      identifier: nvidia.com/mig-3g.93gb
      displayName: 93GB MIG Slice
      max: 16
    localQueue: unreserved
  unreserved-mig-47gb:
    displayName: 47GB Slice (Unreserved)
    description: >-
      This profile offers access to a 47GB MIG slice from GPU workers, drawing
      from the unreserved pool of resources (limited availability and first
      come, first served)
    cpu: 8
    mem: 47Gi
    gpu:
      identifier: nvidia.com/mig-2g.47gb
      displayName: 47GB MIG Slice
      max: 16
    localQueue: unreserved
  unreserved-mig-23gb:
    displayName: 23GB Slice (Unreserved)
    description: >-
      This profile offers access to a 23GB MIG slice from GPU workers, drawing
      from the unreserved pool of resources (limited availability and first
      come, first served)
    cpu: 4
    mem: 23Gi
    gpu:
      identifier: nvidia.com/mig-1g.23gb
      displayName: 23GB MIG Slice
      max: 56
    localQueue: unreserved

# userNamespaces is kept for single-tenant backwards compat; use tenantGroups for multi-tenant.
userNamespaces:
  labels:
    opendatahub.io/dashboard: "true"
    kueue-managed: "true"
    kueue.openshift.io/managed: "true"
    rhai-tmm.dev/owner: "{{ lower .username }}"
  annotations:
    openshift.io/display-name: "User {{ title .username }} Project"
    openshift.io/description: >
      A managed namespace for {{ .username }} to self-serve resources
    openshift.io/requester: gitops
  clusterRoles:
    - admin
  localQueues:
    - name: default
      clusterQueue: default
    - name: unreserved
      clusterQueue: unreserved
  htpasswdUsers: []
  users: []

# tenantGroups defines multiple isolated tenant namespaces, each with their own prefix.
# Each entry creates user namespaces, local queues, and role bindings for all users in the group.
tenantGroups:
  - name: tenanta
    prefix: ""
    users:
      - tenanta-user1
      - tenanta-user2
    htpasswdUsers: []
    labels:
      opendatahub.io/dashboard: "true"
      kueue-managed: "true"
      kueue.openshift.io/managed: "true"
      rhai-tmm.dev/owner: "{{ lower .username }}"
    annotations:
      openshift.io/display-name: "Tenant A - {{ title .username }}"
      openshift.io/description: Tenant A namespace for {{ .username }}
      openshift.io/requester: gitops
    clusterRoles:
      - admin
    localQueues:
      - name: default
        clusterQueue: default
      - name: unreserved
        clusterQueue: unreserved
  - name: tenantb
    prefix: ""
    users:
      - tenantb-user1
      - tenantb-user2
    htpasswdUsers: []
    labels:
      opendatahub.io/dashboard: "true"
      kueue-managed: "true"
      kueue.openshift.io/managed: "true"
      rhai-tmm.dev/owner: "{{ lower .username }}"
    annotations:
      openshift.io/display-name: "Tenant B - {{ title .username }}"
      openshift.io/description: Tenant B namespace for {{ .username }}
      openshift.io/requester: gitops
    clusterRoles:
      - admin
    localQueues:
      - name: default
        clusterQueue: default
      - name: unreserved
        clusterQueue: unreserved
  - name: tenantc
    prefix: ""
    users:
      - tenantc-user1
      - tenantc-user2
    htpasswdUsers: []
    labels:
      opendatahub.io/dashboard: "true"
      kueue-managed: "true"
      kueue.openshift.io/managed: "true"
      rhai-tmm.dev/owner: "{{ lower .username }}"
    annotations:
      openshift.io/display-name: "Tenant C - {{ title .username }}"
      openshift.io/description: Tenant C namespace for {{ .username }}
      openshift.io/requester: gitops
    clusterRoles:
      - admin
    localQueues:
      - name: default
        clusterQueue: default
      - name: unreserved
        clusterQueue: unreserved
