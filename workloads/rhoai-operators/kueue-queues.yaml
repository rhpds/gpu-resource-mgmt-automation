              nominalQuota: "0"
            - name: 2g-70gb
              nominalQuota: "0"
            - name: 3g-139gb
              nominalQuota: "0"
            - name: 3g-140gb
              nominalQuota: "0"
            - name: 3g-20gb
              nominalQuota: "0"
            - name: 3g-40gb
              nominalQuota: "0"
            - name: 3g-71gb
              nominalQuota: "0"
            - name: 3g-90gb
              nominalQuota: "0"
            - name: 3g-93gb
              nominalQuota: "0"
            - name: 4g-139gb
              nominalQuota: "0"
            - name: 4g-140gb
              nominalQuota: "0"
            - name: 4g-20gb
              nominalQuota: "0"
            - name: 4g-40gb
              nominalQuota: "0"
            - name: 4g-71gb
              nominalQuota: "0"
            - name: 4g-90gb
              nominalQuota: "0"
