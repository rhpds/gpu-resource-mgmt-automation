              nominalQuota: "0"
            - name: 7g-141gb
              nominalQuota: "0"
            - name: 7g-180gb
              nominalQuota: "0"
            - name: 7g-186gb
              nominalQuota: "0"
            - name: 7g-278gb
              nominalQuota: "0"
