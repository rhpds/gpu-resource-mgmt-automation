---
# Static replacement for the Kueue wiring the gpu-config-plugin used to
# provision on every Deploy (pkg/kube/kueue.go). The config plugin is held
# back until its Phase C DRA-awareness work lands (see
# ~/.opencode/plan/fake-gpu-operator-dra-shares-mig.md), so this manifest
# carries its borrow-model quota shape verbatim:
#   - ClusterQueues carry ZEROED quotas; the Cohort holds the real capacity
#     and workloads borrow from it (borrowWithinCohort in unreserved-priority).
#   - DRA note: DRA claims (DeviceClasses gpu.nvidia.com + mig.nvidia.com)
#     charge the product-derived logical quota h200-gpu via the
#     deviceClassMappings in kueue-cr.yaml — 1 quota unit per allocated
#     claim (H200 mirror: 2 DRA nodes, dedicated whole boards + MIG slices;
#     the fold stays 1 claim = 1 unit until C1's per-profile classes).
# Sizes are placeholders for the new cluster: set cpu/memory to
# worker-count x per-node. (nvidia.com/gpu extended-resource quota retired with
# the L40S device-plugin pool — H200 mirror is DRA-only.)
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-pool
  labels:
    gpu-config-plugin.openshift.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  # NO nodeLabels: the flavor spans ALL simulated-GPU pools (dra-share /
  # dra-mig), and Kueue stamps flavor nodeLabels onto admitted pods —
  # pinning them to one pool would either strand DRA workloads on a node
  # with no matching slices or exclude the DRA pools entirely. Pool
  # targeting happens through DRA device selection (DeviceClass + CEL on
  # the claim), not node labels.
  {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Cohort
metadata:
  name: unreserved
  labels:
    gpu-config-plugin.openshift.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - h200-gpu
        - h200-mig-1g-18gb
        - h200-mig-1g-35gb
        - h200-mig-2g-35gb
        - h200-mig-3g-71gb
        - h200-mig-4g-71gb
        - h200-mig-7g-141gb
      flavors:
        - name: gpu-pool
          resources:
            - name: cpu
              nominalQuota: "32" # TODO(mike): worker-count x per-node cpu
            - name: memory
              nominalQuota: "224Gi" # TODO(mike): worker-count x per-node memory
            # Dynamic MIG Booking flex model (~/.opencode/plans/dynamic-mig-booking.md):
            # 16 boards total — 8 dedicated (whole-only, no MIG surface) + 8 flex
            # (whole XOR partitions, counter-set exclusivity at allocation).
            # Per-lane maxima = table instances x 8 flex boards; the app's
            # availability engine enforces the CROSS-lane board math at booking
            # time (per-lane quotas are independent here — 16 whole + 4x 7g.141gb
            # passes every lane but needs 20 boards).
            - name: h200-gpu
              nominalQuota: "16" # all 16 parents (8 dedicated + 8 flex)
            - name: h200-mig-1g-18gb
              nominalQuota: "56" # 7/board x 8
            - name: h200-mig-1g-35gb
              nominalQuota: "32" # 4/board x 8
            - name: h200-mig-2g-35gb
              nominalQuota: "24" # 3/board x 8
            - name: h200-mig-3g-71gb
              nominalQuota: "16" # 2/board x 8
            - name: h200-mig-4g-71gb
              nominalQuota: "8" # 1/board x 8
            - name: h200-mig-7g-141gb
              nominalQuota: "8" # 1/board x 8
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: unreserved
  labels:
    gpu-config-plugin.openshift.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  cohortName: unreserved
  namespaceSelector: {}
  # W4b booker enforcement (dynamic-mig-booking.md): workloads in this CQ
  # must pass the booking plugin's "booker" AdmissionCheck — charges covered
  # by an active booking, or within free lane capacity (catalog − bookings −
  # other unreserved charges, per-node max per pod) — before Kueue admits
  # them. The strategy form is load-bearing: this operand silently drops the
  # plain spec.admissionChecks list. The plugin's enforcer self-heals this
  # wiring every pass (ensureUnreservedCQCheck) if it is ever lost.
  admissionChecksStrategy:
    admissionChecks:
      - name: booker
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - h200-gpu
        - h200-mig-1g-18gb
        - h200-mig-1g-35gb
        - h200-mig-2g-35gb
        - h200-mig-3g-71gb
        - h200-mig-4g-71gb
        - h200-mig-7g-141gb
      flavors:
        - name: gpu-pool
          resources:
            - name: cpu
              nominalQuota: "0"
            - name: memory
              nominalQuota: "0Gi"
            - name: h200-gpu
              nominalQuota: "0"
            - name: h200-mig-1g-18gb
              nominalQuota: "0"
            - name: h200-mig-1g-35gb
              nominalQuota: "0"
            - name: h200-mig-2g-35gb
              nominalQuota: "0"
            - name: h200-mig-3g-71gb
              nominalQuota: "0"
            - name: h200-mig-4g-71gb
              nominalQuota: "0"
            - name: h200-mig-7g-141gb
              nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: unreserved-priority
  labels:
    gpu-config-plugin.openshift.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  cohortName: unreserved
  namespaceSelector:
    matchLabels:
      rhai-tmm.dev/clusterqueues: h200-priority
  preemption:
    borrowWithinCohort:
      maxPriorityThreshold: 100
      policy: LowerPriority
    reclaimWithinCohort: LowerPriority
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - h200-gpu
        - h200-mig-1g-18gb
        - h200-mig-1g-35gb
        - h200-mig-2g-35gb
        - h200-mig-3g-71gb
        - h200-mig-4g-71gb
        - h200-mig-7g-141gb
      flavors:
        - name: gpu-pool
          resources:
            - name: cpu
              nominalQuota: "0"
            - name: memory
              nominalQuota: "0Gi"
            - name: h200-gpu
              nominalQuota: "0"
            - name: h200-mig-1g-18gb
              nominalQuota: "0"
            - name: h200-mig-1g-35gb
              nominalQuota: "0"
            - name: h200-mig-2g-35gb
              nominalQuota: "0"
            - name: h200-mig-3g-71gb
              nominalQuota: "0"
            - name: h200-mig-4g-71gb
              nominalQuota: "0"
            - name: h200-mig-7g-141gb
              nominalQuota: "0"
---
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: unreserved-gpu
  namespace: redhat-ods-applications
  labels:
    gpu-config-plugin.openshift.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: '[]'
  # displayName follows the config plugin's spelling: "Unreserved <GPUProduct> GPU"
spec:
  identifiers:
    - displayName: Unreserved NVIDIA-H200 GPU
      identifier: h200-gpu
      defaultCount: 1
      maxCount: 12
      minCount: 1
  scheduling:
    type: Queue
    kueue:
      localQueueName: unreserved
      priorityClass: None
