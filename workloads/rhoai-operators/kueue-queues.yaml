apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: unreserved-gpu
  namespace: redhat-ods-applications
  labels:
    gpu-config-plugin.openshift.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: '[]'
  # displayName follows the config plugin's spelling: "Unreserved <GPUProduct> GPU"
spec:
  identifiers:
    - displayName: Unreserved GPU
      identifier: gpu
      defaultCount: 1
      # Current-world bootstrap (2026-11-26: 3 x 8 whole H100); the booking
      # app's reservation flow owns per-reservation profiles dynamically.
      maxCount: 24
      minCount: 1
  scheduling:
    type: Queue
    kueue:
      localQueueName: unreserved
      priorityClass: None
