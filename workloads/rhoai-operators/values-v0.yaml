---
# list of operators
operators:
  # rhoai
  - name: rhods-operator
    namespace:
      name: redhat-ods-operator
      create: true
      global: true
    channels: [stable-3.x] # v0,1
    version: "3.6.0" # v1
    catalog: openshift-redhat-operators #v1
    source: rhoai-catalog-nightly #source: redhat-operators
    sourceNamespace: openshift-marketplace # v0
    enabled: true

  # kueue
  - name: kueue-operator
    namespace:
      name: openshift-kueue-operator
      create: true
      global: true
    channels: [stable-v1.5] # v0,1
    version: "1.5.0" # v1
    catalog: openshift-redhat-operators #v1
    source: redhat-operators # v0
    sourceNamespace: openshift-marketplace # v0
    enabled: true

  # leader worker set
  - name: leader-worker-set
    namespace:
      name: openshift-lws-operator
      create: true
      global: false
    channels: [stable-v1.0] # v0,1
    version: "1.0.0" # v1
    catalog: openshift-redhat-operators #v1
    source: redhat-operators # v0
    sourceNamespace: openshift-marketplace # v0
    enabled: true

  # rhcl - kuadrant
  - name: rhcl-operator
    namespace:
      name: kuadrant-system
      create: true
      global: true
    channels: [stable-1.5] # v0,1
    version: "1.5.0" # v1
    catalog: openshift-redhat-operators #v1
    source: redhat-operators # v0
    sourceNamespace: openshift-marketplace # v0
    enabled: true

  # jobset
  - name: job-set
    namespace:
      name: openshift-jobset-operator
      create: true
      global: false
    channels: [stable-v1.0] # v0,1
    version: "1.0.0" # v1
    catalog: openshift-redhat-operators #v1
    source: redhat-operators # v0
    sourceNamespace: openshift-marketplace # v0
    enabled: true
