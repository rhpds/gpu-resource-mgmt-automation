---
apiVersion: kueue.openshift.io/v1
kind: Kueue
metadata:
  name: cluster
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  config:
    integrations:
      frameworks:
        - BatchJob
        - Deployment
        - Pod
        - PyTorchJob
        - RayCluster
        - RayJob
        - StatefulSet
        - TrainJob
    preemption:
      preemptionPolicy: Classical
    # DRA quota mapping (Kueue 1.5, requires OCP 5.0+): charge DeviceClass
    # gpu.nvidia.com devices against the logical resource the booking app
    # emits for the DRA share surface (product-derived, see
    # gpu-booking-dra-ui-ux.md): ClusterQueue quotas under that name count
    # 1 per allocated claim/share. Without a mapping, DRA workloads are
    # inadmissible with "DeviceClass gpu.nvidia.com is not mapped in DRA
    # configuration for podset <podset>".
    # mig.nvidia.com (dynamic-MIG claims) charges the SAME logical surface:
    # a carved partition books one unit of the A100 share pool, so MIG
    # bookings show up in the booking app's consumed view next to share
    # bookings. Phase C (config plugin DRA-awareness) may split MIG onto its
    # own product-derived surface once the app models per-profile capacity.
    # ONE logical name per DeviceClass: nvidia.com/gpu stays the
    # device-plugin (extended resource) quota for the L40S pool and must NOT
    # also appear here — device-plugin workloads charge extended-resource
    # quota natively and never consult this mapping.
    # Kueue reads this config only at controller startup — the operand must
    # restart after a change.
    resources:
      deviceClassMappings:
        # Product-agnostic DRA quota mapping — GENERATED by
        # hack/generate-kueue-agnostic.py from the fork profile catalog
        # (2026-11-26, Mike: fold `gpu`, profile-only lane names, +me
        # variants excluded). One fold (whole devices + the shared MIG
        # class charge the whole lane) plus one entry per catalog MIG
        # profile, so ANY product swap via the gpu-config-plugin finds its
        # mapping already present: Kueue is never edited/restarted for
        # swaps. Names speak PROFILE (mig-<profile>), never product.
        # Matches the booking app's DRA_QUOTA_NAMING=profile mode.
        # Product-agnostic DRA quota mapping — GENERATED by
        # hack/generate-kueue-agnostic.py from the fork profile catalog
        # (2026-11-26, Mike: fold `gpu`, profile-only lane names, +me
        # variants excluded, products scoped h200+h100). One fold (whole
        # devices + the shared MIG class charge the whole lane) plus one
        # entry per catalog MIG profile, so product swaps via the
        # gpu-config-plugin find their mapping already present: Kueue is
        # never edited/restarted for swaps WITHIN the provisioned set.
        # The Kueue CR caps deviceClassMappings at 16 entries (CRD
        # validation, live finding 2026-11-26) — 13 used, 3 spare; adding
        # a product = re-run the generator + operand restart.
        # Names speak PROFILE (mig-<profile>), never product.
        # Matches the booking app's DRA_QUOTA_NAMING=profile mode.
        - name: gpu
          deviceClassNames:
            - gpu.nvidia.com
            - mig.nvidia.com
        - name: 1g-10gb
          deviceClassNames:
            - mig.nvidia.com-1g-10gb
        - name: 1g-18gb
          deviceClassNames:
            - mig.nvidia.com-1g-18gb
        - name: 1g-20gb
          deviceClassNames:
            - mig.nvidia.com-1g-20gb
        - name: 1g-35gb
          deviceClassNames:
            - mig.nvidia.com-1g-35gb
        - name: 2g-20gb
          deviceClassNames:
            - mig.nvidia.com-2g-20gb
        - name: 2g-35gb
          deviceClassNames:
            - mig.nvidia.com-2g-35gb
        - name: 3g-40gb
          deviceClassNames:
            - mig.nvidia.com-3g-40gb
        - name: 3g-71gb
          deviceClassNames:
            - mig.nvidia.com-3g-71gb
        - name: 4g-40gb
          deviceClassNames:
            - mig.nvidia.com-4g-40gb
        - name: 4g-71gb
          deviceClassNames:
            - mig.nvidia.com-4g-71gb
        - name: 7g-141gb
          deviceClassNames:
            - mig.nvidia.com-7g-141gb
        - name: 7g-80gb
          deviceClassNames:
            - mig.nvidia.com-7g-80gb
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal
  # GitOps gotcha (seen 2026-11-25): after edits to kueue-queues.yaml, ArgoCD
  # syncs the ClusterQueues but leaves this Cohort's sibling `unreserved`
  # OutOfSync — verify `kubectl get cohort unreserved` after each change and
  # re-apply the rendered Cohort when stale.
  #
  # DRA quota (deviceClassMappings above) charges only ResourceClaimTemplate
  # workloads: raw Pods referencing claims via resourceClaimName are refused
  # by Kueue, and the quota check requires matching devices in the
  # ResourceSlices — DynamicMIG's carve-at-claim boards therefore charge
  # nothing until carved (whole boards charge normally). Design notes:
  # ~/.opencode/plans/phase-c-h200-dra-booking.md (C1-C3).
