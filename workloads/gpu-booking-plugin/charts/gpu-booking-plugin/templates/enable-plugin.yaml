---
{{- if .Values.enablePlugin }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.plugin.name }}-enable
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.plugin.name }}-enable
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.plugin.name }}-enable
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.plugin.name }}-enable
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: enable-plugin
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              PLUGIN_NAME="{{ .Values.plugin.name }}"
              MAX_RETRIES=10
              for i in $(seq 1 $MAX_RETRIES); do
                CURRENT=$(oc get consoles.operator.openshift.io cluster -o jsonpath='{.spec.plugins}' 2>/dev/null || echo '[]')
                if echo "$CURRENT" | grep -q "\"$PLUGIN_NAME\""; then
                  echo "Plugin $PLUGIN_NAME already enabled"
                  exit 0
                fi
                if oc patch consoles.operator.openshift.io cluster --type=json \
                  -p="[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"$PLUGIN_NAME\"}]" 2>/dev/null; then
                  echo "Plugin $PLUGIN_NAME enabled"
                  exit 0
                fi
                echo "Attempt $i failed (conflict), retrying in 3s..."
                sleep 3
              done
              echo "Failed to enable plugin $PLUGIN_NAME after $MAX_RETRIES attempts"
              exit 1
{{- end }}
