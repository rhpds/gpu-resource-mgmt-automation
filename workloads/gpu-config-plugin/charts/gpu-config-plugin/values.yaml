  # :rhoai-36-dra isolates this workstream from :latest consumers
  # (prelude2 and other environments pull :latest — do not reuse that tag).
  # Digest-pinned lineage:
  # - 79f0204a: Phase C DRA awareness (2026-11-26) — v2 multi-pool deploy
  #   (merge topology: managedBy marker, explicit deletes only, legacy pools
  #   converted on merge), pool backends mock|fake, MIG capability
