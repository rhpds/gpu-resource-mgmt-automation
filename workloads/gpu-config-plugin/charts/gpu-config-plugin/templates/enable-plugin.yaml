---
{{- if .Values.enablePlugin }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.plugin.name }}-enable
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: OnFailure
      containers:
        - name: enable-plugin
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              PLUGIN_NAME="{{ .Values.plugin.name }}"
              CURRENT=$(oc get consoles.operator.openshift.io cluster -o jsonpath='{.spec.plugins}' 2>/dev/null || echo '[]')
              if echo "$CURRENT" | grep -q "\"$PLUGIN_NAME\""; then
                echo "Plugin $PLUGIN_NAME already enabled"
              else
                oc patch consoles.operator.openshift.io cluster --type=json \
                  -p="[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"$PLUGIN_NAME\"}]"
                echo "Plugin $PLUGIN_NAME enabled"
              fi
{{- end }}
